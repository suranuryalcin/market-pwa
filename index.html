<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2e7d32" />
  <title>Market Barkod Okuyucu</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ÜST BAŞLIK -->
  <header class="app-header">
    <h1>🛒 Market Barkod</h1>
    <span id="status" class="status">Hazır</span>
  </header>

  <!-- ANA MENÜ -->
  <main>
    <section id="home-screen" class="screen active">
      <button class="menu-btn primary" id="btn-single">
        📷 Ürün Sorgula
        <small>Tek ürünün barkodunu okut</small>
      </button>
      <button class="menu-btn" id="btn-bulk">
        🧺 Sepeti Tara
        <small>Toplu okuma & toplam fiyat</small>
      </button>
      <button class="menu-btn secondary" id="btn-view-cart">
        🛍️ Sepetim (<span id="cart-count">0</span>)
      </button>
    </section>

    <!-- TARAMA EKRANI -->
    <section id="scan-screen" class="screen">
      <div class="scanner-wrap">
        <video id="video" playsinline muted autoplay></video>
        <div class="scan-box"></div>
        <button id="btn-flash" class="flash-btn" title="Flaşı Aç/Kapat"></button>
      </div>
      <p id="scan-hint" class="hint">Barkodu çerçeveye hizalayın...</p>
      <button class="menu-btn secondary" id="btn-back-scan">← Geri</button>
    </section>

    <!-- ÜRÜN SONUÇ EKRANI -->
    <section id="result-screen" class="screen">
      <div id="product-card" class="card"></div>
      <button class="menu-btn primary" id="btn-add-single">➕ Sepete Ekle</button>
      <button class="menu-btn secondary" id="btn-scan-again">🔁 Tekrar Tara</button>
      <button class="menu-btn secondary" id="btn-back-result">← Ana Menü</button>
    </section>

    <!-- SEPET EKRANI -->
    <section id="cart-screen" class="screen">
      <ul id="cart-list" class="cart-list"></ul>
      <div class="total-box">
        <span>Toplam:</span>
        <strong id="cart-total">0,00 ₺</strong>
      </div>
      <button class="menu-btn secondary" id="btn-clear-cart">🗑️ Sepeti Temizle</button>
      <button class="menu-btn secondary" id="btn-back-cart">← Ana Menü</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
